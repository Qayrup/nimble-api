<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bd34fe">
        <animate attributeName="stop-color" values="#bd34fe;#41d1ff;#bd34fe" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#41d1ff">
        <animate attributeName="stop-color" values="#41d1ff;#bd34fe;#41d1ff" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <text x="300" y="100" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800"
        fill="url(#grad)" filter="url(#glow)"
        letter-spacing="2">
    nimble-api
  </text>

  <text x="300" y="100" text-anchor="middle" dominant-baseline="central"
        font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800"
        fill="url(#grad)" opacity="0.3"
        letter-spacing="2">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite" />
    nimble-api
  </text>
</svg>
